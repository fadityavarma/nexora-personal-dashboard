<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexora — Personal Dashboard</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#edf0ff;background:#0b0d17}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#24234a 0,transparent 36%),#0b0d17}.shell{max-width:1060px;margin:auto;padding:36px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:46px}.brand{font-size:25px;font-weight:850;letter-spacing:-1px}.brand span{color:#9b8cff}.tag{border:1px solid #34364e;border-radius:99px;padding:9px 15px;color:#bfc2d9;font-size:12px}h1{font-size:clamp(34px,6vw,56px);letter-spacing:-2px;margin:0 0 10px}p{color:#a6abc4}.hero{margin-bottom:32px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.card,.panel{background:#171a2b;border:1px solid #2b2e46;border-radius:20px;padding:24px}.metric{font-size:36px;font-weight:800;margin:12px 0 0}.muted{color:#a6abc4;font-size:13px}.panel{margin-top:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h2{margin:0;font-size:21px}.form{display:flex;gap:10px;margin:24px 0}input{flex:1;min-width:0;background:#0e1120;border:1px solid #343750;border-radius:12px;color:white;padding:14px 16px;font:inherit;outline:none}input:focus{border-color:#9585ff}button{background:#8e7cff;border:0;color:#101124;border-radius:12px;padding:12px 18px;font-weight:750;cursor:pointer}button:hover{filter:brightness(1.12)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{background:#25283e;color:#c4c7db;padding:8px 13px}.filter.active{background:#8e7cff;color:#101124}.task{display:flex;align-items:center;gap:14px;padding:17px 0;border-top:1px solid #292c42}.task:first-child{border-top:0}.task label{display:flex;align-items:center;gap:12px;flex:1;overflow-wrap:anywhere}.task input{flex:0 0 auto;width:18px;height:18px;accent-color:#9a8bff}.task.done .task-name{text-decoration:line-through;color:#777e9c}.delete{background:transparent;color:#ff9ca9;padding:8px 10px}.empty{text-align:center;padding:38px;color:#999fbd}.progress{height:10px;background:#2d3048;border-radius:20px;overflow:hidden;margin-top:18px}.bar{height:100%;background:linear-gradient(90deg,#8e7cff,#55dfcf);width:0%;transition:width .25s}footer{margin-top:36px;text-align:center;color:#747a99;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}.shell{padding:24px 16px}.form{flex-direction:column}.form button{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand">✦ Nex<span>ora</span></div><div class="tag">YOUR SPACE. YOUR PACE.</div></header>
    <section class="hero"><h1>Make today <span style="color:#a597ff">count.</span></h1><p>Organizează-ți ziua. Urmărește progresul. Fă lucrurile să se întâmple.</p></section>
    <section class="grid" aria-label="Statistici"><div class="card"><div class="muted">TOTAL TASKURI</div><div class="metric" id="total">0</div></div><div class="card"><div class="muted">FINALIZATE</div><div class="metric" id="done">0</div></div><div class="card"><div class="muted">PROGRES</div><div class="metric" id="percent">0%</div></div></section>
    <section class="panel"><div class="top"><h2>Progresul tău</h2><span class="muted" id="progressLabel">0 din 0 completate</span></div><div class="progress" role="progressbar" aria-label="Progres taskuri" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress"><div class="bar" id="bar"></div></div></section>
    <section class="panel"><div class="top"><h2>Taskurile mele</h2><div class="filters"><button class="filter active" data-filter="all">Toate</button><button class="filter" data-filter="active">Active</button><button class="filter" data-filter="done">Finalizate</button></div></div><form class="form" id="taskForm"><input id="taskInput" placeholder="Ce vrei să faci astăzi?" aria-label="Task nou" maxlength="140" required/><button type="submit">+ Adaugă task</button></form><div id="tasks" aria-live="polite"></div></section>
    <footer>Built with ♥ · Nexora © 2026</footer>
  </main>
  <script>
    const KEY='nexora-tasks-v1';
    let tasks=[];try{const saved=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(saved))tasks=saved.filter(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&typeof t.done==='boolean')}catch(e){}
    let filter='all';const $=id=>document.getElementById(id);
    const save=()=>localStorage.setItem(KEY,JSON.stringify(tasks));
    function render(){const done=tasks.filter(t=>t.done).length,pct=tasks.length?Math.round(done/tasks.length*100):0;$('total').textContent=tasks.length;$('done').textContent=done;$('percent').textContent=pct+'%';$('progressLabel').textContent=`${done} din ${tasks.length} completate`;$('bar').style.width=pct+'%';$('progress').setAttribute('aria-valuenow',pct);const list=$('tasks');list.replaceChildren();const visible=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=tasks.length?'Nu există taskuri în această categorie.':'Încă nu ai taskuri. Adaugă primul tău task!';list.append(empty)}visible.forEach(t=>{const row=document.createElement('div');row.className='task'+(t.done?' done':'');const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=t.done;check.addEventListener('change',()=>{t.done=check.checked;save();render()});const name=document.createElement('span');name.className='task-name';name.textContent=t.text;label.append(check,name);const del=document.createElement('button');del.className='delete';del.textContent='Șterge';del.setAttribute('aria-label','Șterge '+t.text);del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render()});row.append(label,del);list.append(row)})}
    $('taskForm').addEventListener('submit',e=>{e.preventDefault();const text=$('taskInput').value.trim();if(!text)return;tasks.unshift({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),text,done:false});$('taskInput').value='';save();render()});document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{filter=btn.dataset.filter;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===btn));render()}));render();
  </script>
</body>
</html>
